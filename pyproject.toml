[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "msa"
version = "0.2.0"
description = "Multiplicity of Structured Agentic Capabilities — multi-agent + skill integration with pluggable local/remote backends and custom training"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.92.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]
# Local LLM via HuggingFace transformers (in-process)
local = [
    "transformers>=4.40",
    "torch>=2.2",
    "accelerate>=0.30",
]
# Routing helpers
embed = [
    "sentence-transformers>=2.7",
    "numpy>=1.24",
]
learn = [
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "numpy>=1.24",
]
# Full custom-training stack: distillation, LoRA fine-tuning
training = [
    "transformers>=4.40",
    "torch>=2.2",
    "datasets>=2.18",
    "peft>=0.11",
    "accelerate>=0.30",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "numpy>=1.24",
]
all = [
    "msa[dev,local,embed,learn,training]",
]

[project.scripts]
msa-bench = "bench:main"
msa-train-router = "msa.training.train_router:main"
msa-bandit = "msa.training.bandit:main"
msa-distill = "msa.training.distill:main"
msa-lora = "msa.training.lora:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
